name: Build Windows package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jev-router-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @('src/JevRouter.ps1','src/RouterCore.psm1','cli/JevRouterCLI.ps1','install.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count) {
              $failed = $true
              foreach ($errorItem in $parseErrors) {
                Write-Error "$file : $($errorItem.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      - name: Build portable package
        shell: powershell
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          $assetName = "JevRouter-Windows-v$version.zip"

          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path build\JevRouter\app -Force | Out-Null

          Copy-Item .\src\JevRouter.ps1 build\JevRouter\app\JevRouter.ps1
          Copy-Item .\src\RouterCore.psm1 build\JevRouter\app\RouterCore.psm1
          Copy-Item .\LICENSE build\JevRouter\LICENSE
          Copy-Item .\THIRD_PARTY_NOTICES.md build\JevRouter\THIRD_PARTY_NOTICES.md

          $launcher = @'
          Option Explicit

          Dim shell, fso, root, scriptPath, command
          Set shell = CreateObject("WScript.Shell")
          Set fso = CreateObject("Scripting.FileSystemObject")

          root = fso.GetParentFolderName(WScript.ScriptFullName)
          scriptPath = fso.BuildPath(root, "app\JevRouter.ps1")
          command = "powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File """ & scriptPath & """"

          shell.Run command, 0, False
          '@
          Set-Content -LiteralPath 'build\JevRouter\Jev Router.vbs' -Value $launcher -Encoding ASCII

          Compress-Archive -Path build\JevRouter -DestinationPath $assetName -Force
          "JEV_ASSET_NAME=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test Windows launchers
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\src\JevRouter.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "JevRouter.ps1 self-test failed with exit code $LASTEXITCODE."
          }

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\src\JevRouter.ps1 -XamlTest
          if ($LASTEXITCODE -ne 0) {
            throw "JevRouter.ps1 XAML test failed with exit code $LASTEXITCODE."
          }

          $module = Resolve-Path .\src\RouterCore.psm1
          $warnings = @()
          Import-Module $module -Force -WarningVariable warnings -WarningAction SilentlyContinue
          if ($warnings.Count -gt 0) {
            throw "RouterCore emitted import warnings: $($warnings -join ' | ')"
          }

          Initialize-JevRouterStorage
          Get-JevRouterPaths | Out-Null

          $public = @(
            'Initialize-JevRouterStorage',
            'Save-TypeSafeKey',
            'Get-SavedTypeSafeKey',
            'Remove-SavedTypeSafeKey',
            'Get-JevRouterPaths',
            'Test-TypeSafeApiKey',
            'Get-SystemStatus',
            'Install-CodexBridge',
            'Remove-CodexBridge',
            'Initialize-ClaudeIntegration',
            'Remove-ClaudeIntegration',
            'Reset-JevRouterAll',
            'Get-CodexBridgeStatusText'
          )
          foreach ($name in $public) {
            if (-not (Get-Command $name -ErrorAction SilentlyContinue)) {
              throw "Expected public RouterCore command is missing: $name"
            }
          }

          $guiSource = Get-Content .\src\JevRouter.ps1 -Raw
          if ($guiSource -match '\bStart-Job\b') {
            throw 'GUI path must not use Start-Job because it can spawn a visible PowerShell host.'
          }
          if ($guiSource -notmatch 'x:Name="ClaudeInstructions"') {
            throw 'ClaudeInstructions XAML control is missing.'
          }

          foreach ($control in @('ClearKeyButton','CodexToggleButton','OpenCodexButton','ClaudeToggleButton','OpenClaudeButton','YouTubeButton','GitHubButton','WebsiteButton')) {
            if ($guiSource -notmatch ('x:Name="' + [regex]::Escape($control) + '"')) {
              throw "Required GUI control is missing: $control"
            }
          }
          if ($guiSource -notmatch [regex]::Escape("Background 'Disconnect Claude'")) {
            throw 'Claude disconnect action is not wired to the background worker.'
          }
          if ($guiSource -notmatch [regex]::Escape("Background 'Disconnect Codex'")) {
            throw 'Codex disconnect action is not wired to the toggle button.'
          }
          if ($guiSource -notmatch 'WindowState="Maximized"') {
            throw 'GUI must open maximized.'
          }
          if ($guiSource -notmatch [regex]::Escape("Start-Process 'codex://threads/new'")) {
            throw 'Open Codex button is not wired to the Codex deep link.'
          }
          foreach ($url in @('https://www.youtube.com/@tunnellab','https://github.com/pouramin','https://pouramin.dev/')) {
            if ($guiSource -notmatch [regex]::Escape($url)) {
              throw "Footer social link is missing: $url"
            }
          }
          if ($guiSource -notmatch [regex]::Escape('Remove-SavedTypeSafeKey')) {
            throw 'Clear saved key control is not wired to DPAPI key removal.'
          }

          $launcher = Get-Content .\START_JEV_ROUTER.vbs -Raw
          if ($launcher -notmatch 'shell\.Run command, 0, False') {
            throw 'Console-free VBScript launcher is not configured correctly.'
          }

          $coreSource = Get-Content .\src\RouterCore.psm1 -Raw
          if ($coreSource -notmatch [regex]::Escape("'install','--key-file',`$script:BridgeEnvFile")) {
            throw 'Codex install must pass the key file explicitly.'
          }
          if ($coreSource -notmatch [regex]::Escape("Set-Content -Path `$script:BridgeEnvFile -Value `$content -Encoding ASCII")) {
            throw 'Codex key file must be written without a UTF-8 BOM.'
          }
          if ($coreSource -notmatch [regex]::Escape("'plugin','install',`$pluginId,'--scope','user'")) {
            throw 'Claude setup must install the plugin automatically.'
          }
          if ($coreSource -notmatch [regex]::Escape('function Remove-JevCodexConfigFallback')) {
            throw 'Codex disconnect fallback cleanup is missing.'
          }
          if ($coreSource -notmatch [regex]::Escape("Remove-Item -LiteralPath `$bridgeHome -Recurse -Force")) {
            throw 'Codex disconnect must remove stale bridge installation state.'
          }
          if ($coreSource -notmatch [regex]::Escape("'plugin','uninstall','jev-model-router@jev-model-router','--scope','user'")) {
            throw 'Claude disconnect must uninstall the Jev Model Router plugin.'
          }

          # Validate the exact end-user package layout.
          $packageRoot = Resolve-Path .\build\JevRouter
          $rootNames = @(Get-ChildItem $packageRoot | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedRoot = @('app','Jev Router.vbs','LICENSE','THIRD_PARTY_NOTICES.md') | Sort-Object
          if (($rootNames -join '|') -ne ($expectedRoot -join '|')) {
            throw "Unexpected files in portable package root: $($rootNames -join ', ')"
          }

          $appNames = @(Get-ChildItem (Join-Path $packageRoot 'app') | Select-Object -ExpandProperty Name | Sort-Object)
          $expectedApp = @('JevRouter.ps1','RouterCore.psm1') | Sort-Object
          if (($appNames -join '|') -ne ($expectedApp -join '|')) {
            throw "Unexpected files in portable app folder: $($appNames -join ', ')"
          }

          $releaseLauncher = Get-Content (Join-Path $packageRoot 'Jev Router.vbs') -Raw
          if ($releaseLauncher -notmatch [regex]::Escape('app\JevRouter.ps1') -or $releaseLauncher -notmatch 'shell\.Run command, 0, False') {
            throw 'Stable portable launcher is not configured for the internal app folder.'
          }

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\build\JevRouter\app\JevRouter.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged app self-test failed with exit code $LASTEXITCODE."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JevRouter-Windows-Package
          path: ${{ env.JEV_ASSET_NAME }}
          retention-days: 30

      - name: Resolve release channel
        id: meta
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ "$COMMIT_MESSAGE" == release:\ v* ]]; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "title=Jev Router for Windows v$VERSION" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Jev Router for Windows — Latest Development Build" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create stable version tag
        if: steps.meta.outputs.stable == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Stable tag $RELEASE_TAG already exists; leaving it immutable."
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Move rolling latest tag
        if: steps.meta.outputs.rolling == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          STABLE_RELEASE: ${{ steps.meta.outputs.stable }}
        run: |
          if ($env:STABLE_RELEASE -eq 'true') {
            $notes = @"
          # Jev Router for Windows v1.0.0

          First stable release.

          - One-click Codex routing through jev-codex-bridge.
          - Automatic Claude Code plugin installation and removal.
          - Connect / Disconnect toggle controls.
          - Open Codex / Open Claude shortcuts.
          - TypeSafe key verification, DPAPI storage, and saved-key removal.
          - Console-free maximized Windows UI.
          - Clean portable package with only the runtime files and required legal notices.

          Extract the ZIP and double-click **Jev Router.vbs**.

          The Windows build is currently unsigned.
          "@
          } else {
            $notes = @"
          Development build of Jev Router for Windows.

          This rolling build tracks main and may change between commits.
          "@
          }

          $asset = $env:JEV_ASSET_NAME
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousPreference

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $asset --clobber
            if ($env:STABLE_RELEASE -eq 'true') {
              gh release edit $env:RELEASE_TAG --title $env:RELEASE_TITLE --notes $notes --latest
            } else {
              gh release edit $env:RELEASE_TAG --title $env:RELEASE_TITLE --notes $notes --prerelease
            }
          }
          else {
            if ($env:STABLE_RELEASE -eq 'true') {
              gh release create $env:RELEASE_TAG $asset --title $env:RELEASE_TITLE --notes $notes --latest --target $env:GITHUB_SHA
            } else {
              gh release create $env:RELEASE_TAG $asset --title $env:RELEASE_TITLE --notes $notes --prerelease --target $env:GITHUB_SHA
            }
          }
